<title>DEGEN: The Road to Whale — A Degenerate Gambling RPG</title>
<style>
:root{--bg:#0d0f0c;--panel:#161a14;--line:#2f3a2a;--txt:#e9e4d2;--dim:#9b9886;--green:#5dff8a;--red:#ff5d5d;--amber:#ffc24a;--blue:#6fc3ff;--pink:#ff7ad9;--paper:#efe6cc;--ink:#1c1a15}

// ===================== LIFETIME MONEY STATS (no server; localStorage only) =====================
// Stored under its own key, separate from the run save (degenRPG_save_v1) and META, so it survives new runs and save
// resets. Only Settings -> "Reset lifetime stats" clears it.
// COUNTING RULES (one record per DECIDED bet; see lifeRec callers):
//  * Wagered = real money that was at risk on a bet that got decided (won or lost).
//  * Won     = gross payout handed back on those bets (stake + profit). Net = Won - Wagered.
//  * Pushes, voids, refunds, take-downs, cancelled/unplayed keno races and table-closed refunds count as NEITHER
//    wagered nor won (the money just went back to you), so nothing is double counted.
//  * Bonus-bet tokens are house money: their stake is not "wagered"; whatever they pay counts as won.
//  * A craps place bet that wins and "stays up" counts as decided (stake+win) and re-wagered on the next decision.
//  * Online tables: the host attaches the decided [stake, payout] pairs to each settlement ledger entry (e.lf), and
//    the client records exactly those, once (ledger entries are de-duplicated by sequence number).
//  * Biggest win / loss = largest net profit / loss on a single decided bet (a blackjack hand, a spin spot, a ticket...).
const LIFE_KEY='degenRPG_life_v1';
const LIFE_GAMES={sb:'📱 Sportsbook',bj:'🂡 Blackjack',craps:'🎲 Craps',roul:'🎡 Roulette',slots:'🎰 Slots',scr:'🎟️ Scratchers',keno:'🎱 Keno',f7:'7️⃣ Flip 7',eu:'🃏 Euchre',poker:'♠️ Poker',monte:'👸 Monte',online:'🌐 Online tables',arc:'🕹️ Arcade'};
const LIFE_SUB={bj:'Blackjack',cr:'Craps',rl:'Roulette',sb:'Sportsbook',f7:'Flip 7',kn:'Keno',eu:'Euchre',hrd:'HR Derby',putt:'Mini Putt',bowl:'Bowling'};
function lifeBlank(){ return {v:1,wag:0,won:0,n:0,big:null,bigL:null,since:null,g:{}}; }
function lifeLoad(){ let L=null; try{ L=JSON.parse(localStorage.getItem(LIFE_KEY)||'null'); }catch(e){} if(!L||typeof L!=='object'||L.v!==1) L=lifeBlank(); L.g=L.g||{}; return L; }
let LIFE=lifeLoad();
function lifeSave(){ try{ localStorage.setItem(LIFE_KEY,JSON.stringify(LIFE)); }catch(e){} }
function lifeG(g){ return LIFE.g[g]||(LIFE.g[g]={wag:0,won:0,n:0,w:0,l:0,big:0,bigL:0}); }
// record one decided bet. stake = real money at risk, ret = gross payout (0 if lost). Callers skip pushes/refunds.
function lifeRec(g,stake,ret,what,sub){ if(U.noSave||!LIFE_GAMES[g]) return; stake=Number(stake); ret=Number(ret); if(!Number.isFinite(stake)||!Number.isFinite(ret)) return;
  stake=r2(Math.max(0,Math.min(stake,1e9))); ret=r2(Math.max(0,Math.min(ret,1e9))); if(!stake&&!ret) return;
  const net=r2(ret-stake), G=lifeG(g), when=new Date().toISOString().slice(0,10), who=S&&S.name?S.name:'';
  LIFE.wag=r2(LIFE.wag+stake); LIFE.won=r2(LIFE.won+ret); LIFE.n++; if(!LIFE.since) LIFE.since=when;
  G.wag=r2(G.wag+stake); G.won=r2(G.won+ret); G.n++; if(net>0) G.w++; else if(net<0) G.l++; G.big=Math.max(G.big,net); G.bigL=Math.max(G.bigL,-net);
  if(sub){ G.sub=G.sub||{}; const X=G.sub[sub]||(G.sub[sub]={wag:0,won:0,n:0}); X.wag=r2(X.wag+stake); X.won=r2(X.won+ret); X.n++; }
  const lab=String(what||'').slice(0,60);
  if(net>0&&(!LIFE.big||net>LIFE.big.amt)) LIFE.big={amt:net,g,what:lab,at:when,who};
  if(net<0&&(!LIFE.bigL||-net>LIFE.bigL.amt)) LIFE.bigL={amt:-net,g,what:lab,at:when,who};
  lifeSave(); }
function lifeReset(){ LIFE=lifeBlank(); lifeSave(); }
function lifeNet(){ return r2(LIFE.won-LIFE.wag); }
function lifeSigned(v){ return (v>0?'+':v<0?'-':'')+money(Math.abs(v)); }

  if(S.day<=10 && S.day%3===1 && S.day>1) S.tokens.push({book:S.day%2?'FD':'DQ',type:'bonus',amt:20,label:'"We miss you!" Bonus Bet'});
  if(rnd()<.35) S.tokens.push({book:pick(['DQ','FD']),type:'boost',amt:has('promo')?50:25,label:`${has('promo')?50:25}% Profit Boost (parlays 3+ legs)`});

// Rules per The Op Games' Flip 7 (rules ed. 3.1): 94 cards = number cards 0-12 (one 0, one 1, two 2s ... twelve 12s = 79),
// 6 modifiers (+2 +4 +6 +8 +10, x2) and 9 actions (3x Freeze, 3x Flip Three, 3x Second Chance).
// Dealer deals one card to each player (dealer last); action cards resolve immediately. Then in turn order each active
// player Hits or Stays (Stay only with a card in front of you). Duplicate number = bust (0 for the round) unless you hold
// Second Chance (discard both). 7 unique numbers ends the round for everyone, +15. Score: numbers (x2 doubles them only)
// + modifiers. Game ends after a round where someone has >= target (200); highest wins. Tie at the top -> another round.
// The engine is a step machine: f7Advance() performs ONE atomic step (deal a card, an NPC decision, one Flip Three card...)
// so the UI can animate, and returns 'wait' when a human must decide (G.await), 'over' when the game is done.

const F7_NPCS={

  ned:{n:'NERVOUS NED',ic:'😰',hat:'beanie',color:'#6fc3ff',d:'Stays on 14. Sweats through his hoodie. Somehow still here.'},
  carl:{n:'CARD-COUNTIN\' CARL',ic:'🤓',hat:'visor',color:'#5dff8a',d:'Counts every card. Banned from 3 Applebee\'s trivia nights.'},
  tina:{n:'TILTED TINA',ic:'😤',hat:'bald',color:'#ff7ad9',d:'Plays worse the further behind she gets. So, badly.'}

// ===================== KENO =====================
// 80-ball keno: pick 1-10 spots, the house draws 20. Paytable = "pays X for 1" (total return, stake included).
// Vegas-style video-keno-ish table; exact RTP per spot count is computed from the hypergeometric distribution
// (kenoRTP) and sits between 75% (1-spot) and ~87%, i.e. between live keno (~70-75%) and video keno (~90%).
const KENO_PAY={1:{1:3},2:{2:14},3:{2:2,3:40},4:{2:1,3:5,4:140},5:{3:2,4:25,5:600},6:{3:1,4:8,5:90,6:1800},7:{3:1,4:3,5:20,6:250,7:7000},8:{4:1,5:10,6:90,7:1500,8:25000},9:{4:1,5:5,6:40,7:300,8:4000,9:30000},10:{0:3,5:2,6:20,7:130,8:1000,9:5000,10:100000}};
const KENO_CAP=250000, KENO_RACES=[1,2,5,10,20];
function kenoC(n,k){ if(k<0||k>n) return 0; let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return r; }
function kenoP(spots,hits){ return kenoC(20,hits)*kenoC(60,spots-hits)/kenoC(80,spots); }
function kenoRTP(spots){ let r=0; for(const h in KENO_PAY[spots]) r+=kenoP(spots,+h)*KENO_PAY[spots][h]; return r; }
function kenoDraw(rig){ if(rig&&rig.length===20) return rig.slice(); const a=[]; for(let i=1;i<=80;i++) a.push(i); shuffle(a); return a.slice(0,20); }
function kenoValid(spots){ return Array.isArray(spots)&&spots.length>=1&&spots.length<=10&&spots.every(n=>Number.isInteger(n)&&n>=1&&n<=80)&&new Set(spots).size===spots.length; }
function kenoSettle(spots,drawn,bet){ const d=new Set(drawn); const hits=spots.filter(n=>d.has(n)).length; const mult=(KENO_PAY[spots.length]||{})[hits]||0; return {hits,mult,ret:r2(Math.min(KENO_CAP,bet*mult))}; }
function kenoQuick(n){ const a=[]; for(let i=1;i<=80;i++) a.push(i); return shuffle(a).slice(0,clamp(n,1,10)).sort((x,y)=>x-y); }
const KENO_TALK={big:['KENO! The lounge goes feral. Somebody spilled a White Claw.','Karen the keno runner sprints your ticket like it\'s a kidney transplant.','You hit! The old guy in the Bengals jacket nods slowly. Respect.'],small:['Small hit. Enough for a Coors Light and some shame.','Ticket paid. Barely. Karen sighs on your behalf.'],none:['Nothing. Your numbers are in witness protection.','Zero catches. Karen pats your shoulder. "Next one, hun."','You picked your ex\'s birthday again, didn\'t you.','Brick. The balls hate you personally.']};

// ===================== EUCHRE HALL (rules engine + bots; shared by solo play and the online host) =====================
// 24 cards (9-A), partners sit across (seats 0&2 vs 1&3), 5 cards each + a 4-card kitty with one card turned up.
// Round 1: order up the up-card's suit (dealer picks it up and discards) or pass. Round 2: name any other suit or pass
// (stick the dealer = the dealer can't pass). Right bower (J of trump) > left bower (J of same color, counts as TRUMP
// suit for following) > A K Q 10 9 of trump. Makers 3-4 tricks = 1, all 5 = 2, alone march = 4, euchred = 2 to defenders.
const EU_SUITS=['♠','♥','♦','♣'], EU_SNAME=['Spades','Hearts','Diamonds','Clubs'], EU_RK={9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A'};
const EU_TEAMS=['Team Skyline','Team Gold Star']; // seats 0&2 vs 1&3 (Cincinnati chili parlor war)
const EU_RAKE=.05, EU_OPTS={stick:true,to:10,farmer:false};
function euDeck(){ const d=[]; for(let s=0;s<4;s++) for(let r=9;r<=14;r++) d.push({r,s}); return d; }
const euIsRight=(c,t)=>c.r===11&&c.s===t, euIsLeft=(c,t)=>c.r===11&&c.s===3-t; // same color: ♠↔♣, ♥↔♦
function euSuit(c,t){ return t!=null&&euIsLeft(c,t)?t:c.s; } // the left bower IS trump suit

function mpCleanText(s,n){ return String(s==null?'':s).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u2028-\u202e\u2066-\u2069\ufeff]/g,'').replace(/\s+/g,' ').trim().slice(0,n); }
function mpInt(v,lo,hi){ if(typeof v==='string'&&v.trim()!=='') v=Number(v); if(typeof v!=='number'||!Number.isFinite(v)) return null; v=Math.floor(v); return (v<lo||v>hi)?null:v; }
function mpColor(c){ return (typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c))?c:MP_COLORS[0]; }
// a throwaway "S" for running single-player engine code (genSlate, simRun, crapsRoll...) without touching anyone's save
function mpRoomS(){ const ach={}; for(const k in ACHS) ach[k]=1; return {v:1,name:'ROOM',day:1,cash:0,debt:0,tilt:0,perks:[],inv:{},tmp:{},stats:{luck:0,cha:0,hustle:0,street:0,liver:0},flags:{},ach,

  league:null,slate:null,jefe:{w:0,l:0},whaleMode:false,buzz:0,peak:0,weekPeak:0,lowWater:0,lvl:1,xp:0}; }
function mpWithS(tmp,fn){ const oS=S, oN=U.noSave, oQ=U.silent; S=tmp; U.noSave=true; U.silent=true; try{ return fn(); } finally{ S=oS; U.noSave=oN; U.silent=oQ; } }

// ---- LIVE SESSION LEADERBOARD helpers (pure; the host ranks, clients only render) ----
const MP_LB_TB=['bj','cr','rl','sb','f7','kn','eu'];
function mpLbTable(w){ const m=String(w||'').match(/^(bj|cr|rl|sb|f7|kn|eu)/); return m?m[1]:null; }
function mpLbKey(r,tb){ return tb==='all'?r.net:((r.t&&r.t[tb])||{}).net||0; }
// rank by session net (loans excluded), ties -> more action (wagered), then name; a per-table board lists who played or sits there
function mpLbRank(rows,tb){ const w=r=>tb==='all'?r.w:((r.t&&r.t[tb])||{}).w||0;
  return rows.filter(r=>tb==='all'||(r.t&&r.t[tb])||(!r.left&&r.table===tb)).sort((a,b)=>(mpLbKey(b,tb)-mpLbKey(a,tb))||(w(b)-w(a))||(a.name<b.name?-1:a.name>b.name?1:0)||(a.id<b.id?-1:1)).map(r=>r.id); }
function mpLbStreak(X,n){ if(n>0) X.st=X.st>0?X.st+1:1; else if(n<0) X.st=X.st<0?X.st-1:-1; if(X.st>X.bst) X.bst=X.st; }

function mpHostCreate(io){ // io: {send(cid,msg), now(), room, sess}
  const now=()=>io.now();
  const H={ room:io.room, sess:io.sess, P:{}, order:[], ghost:{}, chat:[], chatN:0, pn:0, dirty:true, rig:{}, closed:false, rs:mpRoomS(), rt:{w:0,r:0,n:0}, lbv:0, lbLead:null, fin:null, t0:io.now() };
  const bj=H.bj={ phase:'bet', seats:Array(MPC.SEATS).fill(null), shoe:newShoe(), dealer:[], hole:true, hands:{}, bets:{}, last:{}, order:[], turn:null, deadline:0, handNo:0, msg:'Place your bets.', doneAt:0, nextDraw:0, needDraw:false };
  const cr=H.cr={ point:null, shooter:null, C:{}, phase:'bet', rollAt:0, deadline:0, last:null, rollNo:0, hist:[], dice:null, thrower:'', sRolls:0 };
  const rl=H.rl={ phase:'bet', bets:{}, ready:{}, deadline:0, n:null, spinAt:0, doneAt:0, spinNo:0, hist:[], res:{} };
  const sb=H.sb={ day:0, phase:'bet', bets:[], ready:{}, deadline:0, games:[], recs:{}, events:[], ei:0, ticker:[], t:0, liveStart:0, finalAt:0, betN:0, stats:{} };
  const pl=c=>H.P[c]||H.ghost[c]||null;
  const idOf=c=>{ const p=pl(c); return p?p.id:null; };
  const nm=c=>{ const p=pl(c); return p?p.name:'?'; };
  const dirty=()=>{ H.dirty=true; };
  const rej=(p,why)=>{ if(p) io.send(p.cid,{t:'rej',why}); return false; };
  function sys(txt){ H.chat.push({i:++H.chatN,sys:1,txt:String(txt).slice(0,200)}); if(H.chat.length>60) H.chat.splice(0,H.chat.length-60); dirty(); }
  function led(p,w,d,out,why,net,x){ if(!p) return; d=r2(d); p.seq++; const e={seq:p.seq,w,d,out:r2(Math.max(0,out)),why:String(why||'').slice(0,90)}; if(net!=null) e.net=r2(net); if(x) Object.assign(e,x);
    if(e.lf){ for(const [s,r] of e.lf){ p.rw=r2((p.rw||0)+s); p.rr=r2((p.rr||0)+r); H.rt.w=r2(H.rt.w+s); H.rt.r=r2(H.rt.r+r); H.rt.n++; } }
    p.bal=r2(p.bal+d); if(e.out>0) p.open[w]=e.out; else delete p.open[w]; if(e.net!=null) lbRec(p,w,e); p.led.push(e); if(p.led.length>400) p.led.splice(0,p.led.length-400); if(H.P[p.cid]&&p.conn) io.send(p.cid,{t:'led',e:[e]}); dirty(); return e; }
  const atTable=tb=>H.order.filter(c=>H.P[c].table===tb);
  // ---------------- LIVE SESSION LEADERBOARD (updated on every settlement; rides along in every broadcast view) ----------------
  function lbRec(p,w,e){ const tb=mpLbTable(w); if(!tb) return; const lf=e.lf||[]; if(tb==='cr'&&!lf.length) return; // a craps roll that decided nothing isn't a "hand"
    const n=e.net, S=p.lb, T=S.t[tb]||(S.t[tb]={n:0,net:0,w:0,big:0,st:0,bst:0});
    for(const X of [S,T]){ X.n++; if(n>X.big) X.big=r2(n); mpLbStreak(X,n); } if(n<S.worst) S.worst=r2(n);
    T.net=r2(T.net+n); T.w=r2(T.w+lf.reduce((a,x)=>a+x[0],0)); H.lbv++;
    const rows=lbRows(), ord=mpLbRank(rows,'all'), top=rows.find(r=>r.id===ord[0]);
    if(rows.length>1&&top&&top.net>0&&ord[0]!==H.lbLead){ if(H.lbLead) sys(`👑 ${top.name} takes the chip lead at ${lifeSigned(top.net)}.`); H.lbLead=ord[0]; } }
  const lbNet=p=>{ let o=0; for(const k in p.open) o+=p.open[k]; return r2(p.bal+o-p.start); }; // settled session net: money riding isn't lost yet, loans aren't profit
  function lbRows(){ const all=H.order.map(c=>H.P[c]).concat(Object.values(H.ghost)); return all.map(p=>{ const S=p.lb, ride=r2(Object.values(p.open).reduce((a,b)=>a+b,0));
    return {id:p.id,name:p.name,color:p.color,net:lbNet(p),bal:p.bal,ride,w:p.rw||0,r:p.rr||0,n:S.n,big:S.big,worst:S.worst,st:S.st,bst:S.bst,loan:p.loaned||0,loanN:p.loanN||0,tab:p.tab||0,
      left:!H.P[p.cid],conn:!!(H.P[p.cid]&&p.conn),host:p.isHost,table:H.P[p.cid]?p.table:null,t:JSON.parse(JSON.stringify(S.t))}; }); }
  H.lb=function(){ const rows=lbRows(), ord={all:mpLbRank(rows,'all')}; for(const tb of MP_LB_TB) ord[tb]=mpLbRank(rows,tb); return {v:H.lbv,rows,ord}; };
  // ---------------- join / leave ----------------
  H.join=function(cid,m,isHost){ if(H.closed) return {err:'Table is closing.'}; cid=String(cid||'').slice(0,40); if(!cid) return {err:'bad hello'};
    const key=String((m&&m.key)||'').slice(0,40), name=mpCleanText(m&&m.name,14)||'Degen', color=mpColor(m&&m.color);
    let cash=Number(m&&m.cash); if(!Number.isFinite(cash)||cash<0) cash=0; cash=r2(Math.min(cash,MPC.MAXCASH));
    const lastSeq=(m&&m.sess===H.sess)?(mpInt(m.lastSeq,0,1e9)||0):0;
    let p=H.P[cid]||H.ghost[cid];
    if(p){ if(p.key!==key) return {err:'That seat belongs to someone else.'};
      const pend=p.led.filter(e=>e.seq>lastSeq); const nb=r2(cash+pend.reduce((s,e)=>s+e.d,0)); p.start=r2(p.start+(nb-p.bal)); p.bal=nb; // trust the save, keep session net
      const back=!!H.ghost[cid]; delete H.ghost[cid]; H.P[cid]=p; if(!H.order.includes(cid)) H.order.push(cid); p.conn=true; p.dcAt=0; p.leaving=false; p.name=name; p.color=color; if(back) p.table='lobby';
      io.send(cid,{t:'welcome',id:p.id,room:H.room,sess:H.sess,bal:p.bal}); if(pend.length) io.send(cid,{t:'led',e:pend}); sys(`🔌 ${name} reconnected.`); return {ok:1,p}; }
    if(H.order.length>=MPC.MAXP) return {err:`Room is full (${MPC.MAXP} degenerates max).`};
    p={cid,key,id:'p'+(++H.pn),name,color,bal:cash,start:cash,table:'lobby',conn:true,dcAt:0,seq:0,led:[],acked:0,lastChat:0,chatBurst:0,isHost:!!isHost,leaving:false,open:{},lb:{n:0,big:0,worst:0,st:0,bst:0,t:{}}};
    H.P[cid]=p; H.order.push(cid); io.send(cid,{t:'welcome',id:p.id,room:H.room,sess:H.sess,bal:p.bal});
    sys(isHost?`🏠 ${name} opened the table with ${money(cash)}.`:`👋 ${name} pulled up a chair with ${money(cash)}.`); return {ok:1,p}; };
  H.drop=function(cid){ const p=H.P[cid]; if(!p||!p.conn) return; p.conn=false; p.dcAt=now(); sys(`📵 ${p.name} lost connection…`); };
  function remove(cid,why,voluntary){ const p=H.P[cid]; if(!p) return;
    bjLeave(p,true); crRefundAll(p,'Left the craps table: chips returned'); if(cr.shooter===cid) cr.shooter=null;
    if(rl.phase==='bet'&&rl.bets[cid]){ const t=sumObj(rl.bets[cid]); delete rl.bets[cid]; delete rl.ready[cid]; led(p,'rl'+(rl.spinNo+1),t,0,'Roulette bets returned'); }
    if(voluntary) for(const b of sb.bets) if(b.cid===cid&&b.status==='open'){ b.status='void'; led(p,b.id,b.stake,0,'Sportsbook bet voided (you left)'); }
    if(f7.phase==='lobby') f7Out(p,'Left: Flip 7 buy-in returned');
    else if(f7.phase==='play'){ const i=f7.cids.indexOf(cid); if(i>=0){ if(voluntary) f7Fold(cid,'left the room'); else f7.G.players[i].auto=true; }
      if(f7.sbNext[cid]){ const B=f7.sbNext[cid]; delete f7.sbNext[cid]; led(p,f7SbW(),f7SbTot(B),0,'Flip 7 side bets returned (you left)'); } }
    if(eu.phase==='lobby') ehStand(p,'Left: euchre ante returned');
    else if(eu.phase==='play'){ const i=eu.cids.indexOf(cid); if(i>=0&&voluntary) ehFold(cid,'left the room');
      if(eu.sbNext[cid]){ const B=eu.sbNext[cid]; delete eu.sbNext[cid]; led(p,euSbW(),euSbTot(B),0,'Euchre side bets returned (you left)'); } }
    if(kn.tickets[cid]){ if(kn.phase==='draw'&&kn.inRace.includes(cid)) kn.tickets[cid].gone=true; else knCancel(p,'Left: keno ticket refunded'); }
    H.order=H.order.filter(c=>c!==cid); delete H.P[cid]; p.conn=false; H.ghost[cid]=p; sys(`🚪 ${p.name} ${why}.`); }
  // ---------------- messages ----------------
  H.msg=function(cid,m){ const p=H.P[cid]; if(!p||!m||typeof m!=='object'||H.closed) return; try{ switch(m.t){
    case 'ack': { const a=mpInt(m.seq,0,1e9); if(a!=null&&a<=p.seq){ p.acked=Math.max(p.acked,a); p.led=p.led.filter(e=>e.seq>p.acked); } return; }
    case 'go': return go(p,m.table);
    case 'loan': return loan(p,m);
    case 'vice': return vice(p,String(m.k||''));
    case 'chat': return chat(p,m);
    case 'bye': remove(cid,'left the room',true); io.send(cid,{t:'byeok'}); return;
    case 'bj.bet': return bjBet(p,mpInt(m.amt,0,MPC.BJ_MAX));
    case 'bj.add': { const v=mpInt(m.v,1,MPC.BJ_MAX); if(v==null) return rej(p,'Bad chip.'); return bjBet(p,Math.min(MPC.BJ_MAX,(bj.bets[cid]||0)+v)); }
    case 'bj.act': return bjAct(cid,String(m.a||''));
    case 'cr.bet': return crBet(p,String(m.k||''),m.n==null?null:mpInt(m.n,0,12),mpInt(m.v,1,MPC.TMAX));
    case 'cr.down': return crDown(p);
    case 'cr.roll': return crRoll(p);
    case 'rl.bet': return rlBet(p,String(m.k||''),mpInt(m.v,1,MPC.TMAX));
    case 'rl.clear': return rlClear(p);
    case 'rl.ready': if(rl.phase==='bet'&&rl.bets[cid]){ rl.ready[cid]=1; dirty(); } return;
    case 'sb.bet': return sbBet(p,m.legs,mpInt(m.stake,1,MPC.TMAX));
    case 'sb.ready': if(sb.phase==='bet'){ sb.ready[cid]=1; dirty(); } return;
    case 'sb.start': if(!p.isHost) return rej(p,'Only the host can start the games.'); if(sb.phase==='bet'&&sb.bets.some(b=>b.status==='open')) sbStart(); else rej(p,'Nobody has bet yet.'); return;
    case 'sb.next': if(!p.isHost) return rej(p,'Only the host can roll the slate.'); if(sb.phase==='final') sbNewSlate(); return;
    case 'f7.buy': return f7Buy(p,mpInt(m.amt,1,1e6),mpInt(m.target,1,1000));
    case 'f7.out': if(f7.phase!=='lobby') return rej(p,'Game already dealt. You\'re in it now.'); return f7Out(p);
    case 'f7.ready': if((f7.phase==='lobby'&&f7.seats.includes(cid))||(f7.phase==='play'&&f7.sbOpen)){ f7.ready[cid]=1; dirty(); } return;
    case 'f7.sb': return f7Sb(p,String(m.k||''),m.i==null?null:mpInt(m.i,0,9),mpInt(m.v,0,1000));
    case 'f7.act': return f7ActMsg(p,String(m.a||''),m.to==null?null:mpInt(m.to,0,9));
    case 'eu.sit': return ehSit(p,mpInt(m.seat,0,3),m.ante==null?null:mpInt(m.ante,1,1e6));
    case 'eu.stand': if(eu.phase!=='lobby') return rej(p,"Cards are out. You're in it now."); return ehStand(p);
    case 'eu.rand': return ehRand(p);
    case 'eu.opt': return ehOpt(p,m);
    case 'eu.ready': if((eu.phase==='lobby'&&eu.seats.includes(cid))||(eu.phase==='play'&&eu.sbOpen)){ eu.ready[cid]=1; dirty(); } return;
    case 'eu.sb': return ehSb(p,String(m.k||''),mpInt(m.v,0,1000));
    case 'eu.act': return ehAct(p,String(m.a||''),m.arg==null?null:mpInt(m.arg,0,5),!!m.alone);
    case 'kn.ticket': return knTicket(p,m.spots,mpInt(m.bet,1,1e6),mpInt(m.races,1,1000));
    case 'kn.cancel': if(kn.phase==='draw'&&kn.inRace.includes(cid)) return rej(p,'Balls are flying. Cancel after this race.'); return knCancel(p);
    case 'kn.ready': if(kn.phase!=='draw'&&kn.tickets[cid]){ kn.ready[cid]=1; dirty(); } return;
    default: return; } }catch(e){ console.warn('mp host msg error',e); } };
  function go(p,tb){ if(!MP_TABLES.includes(tb)||p.table===tb) return; const old=p.table; p.table=tb; if(old==='bj') bjLeave(p,false);
    if(old==='f7'&&f7.phase==='lobby'&&f7.seats.includes(p.cid)) f7Out(p,'Left the Flip 7 table: buy-in returned');
    if(old==='eu'&&eu.phase==='lobby'&&eu.seats.includes(p.cid)) ehStand(p,'Left the Euchre Hall: ante returned');
    if(tb==='f7'&&f7.phase==='play'){ const i=f7.cids.indexOf(p.cid); if(i>=0&&!f7.folded[p.cid]) f7.G.players[i].auto=false; } if(tb==='bj') bjSit(p); if(tb==='sb'&&!sb.day) sbNewSlate(); dirty(); }
  function chat(p,m){ const t=now(); if(t-p.lastChat<700){ if(++p.chatBurst>4) return rej(p,'Easy on the trash talk. (rate limit)'); } else p.chatBurst=0; p.lastChat=t;
    let txt, em=false; if(m.em!=null){ const i=mpInt(m.em,0,200); if(i==null) return; txt=i>=100?MP_EMOJI[i-100]:MP_TALK[i]; if(!txt) return; em=true; } else { txt=mpCleanText(m.txt,MPC.CHATLEN); if(!txt) return; }
    H.chat.push({i:++H.chatN,id:p.id,name:p.name,color:p.color,txt,em}); if(H.chat.length>60) H.chat.splice(0,H.chat.length-60); dirty(); }
  // ---------------- LOANS (re-up without leaving) ----------------
  // The client reports its save's lvl/debt; the host re-runs Sal's loanCap() rule on them, and never lets the
  // effective debt go below what this session already lent (debt can't be paid down while online), so a
  // client can't lie its way past the single-player credit limit. No loans while your own money is mid-hand.
  function loanBusy(c){ return (bj.hands[c]&&(bj.phase==='play'||bj.phase==='dealer'))||(rl.phase==='spin'&&!!rl.bets[c])||f7Busy(c)||ehBusy(c)||(kn.phase==='draw'&&kn.inRace.includes(c)); }
  function loan(p,m){ const amt=mpInt(m.amt,1,1e6); if(amt==null||!MPC.LOANS.includes(amt)) return rej(p,'Sal only does $250, $500, $1k or $2.5k.');
    if(m.whale) return rej(p,"Sal doesn't lend to his business partners.");
    if(loanBusy(p.cid)) return rej(p,'✋ No re-upping mid-hand. Finish the hand first.');
    const t=now(); if(t-(p.lastLoan||-1e12)<MPC.LOAN_GAP) return rej(p,'Slow down, Sal is still counting the last stack.');
    const lvl=mpInt(m.lvl,1,99)||1, debt=Math.max(mpInt(m.debt,0,1e9)||0,p.minDebt||0), cap=Math.max(0,2500+lvl*500-Math.max(0,debt-10000));
    if(amt>cap) return rej(p,cap>=MPC.LOANS[0]?`Sal says your credit's good for ${money(cap)}, tops.`:"Sal says you're tapped. No more credit.");
    p.lastLoan=t; p.minDebt=debt+amt; p.loaned=r2((p.loaned||0)+amt); p.loanN=(p.loanN||0)+1; p.start=r2(p.start+amt); // loans don't count as session winnings
    led(p,'loan'+p.loanN,amt,0,`Loan from Big Sal: ${money(amt)}`,null,{loan:amt});
    sys(pick(MP_LOAN_TALK).replace('{n}',p.name).replace('{a}',money(amt))); }
  // ---------------- TILT RELIEF (cocktail waitress / smoke break) ----------------
  // Allowed mid-hand: it never touches a placed bet (cost must fit in the free bankroll, bets are already out of it).
  function vice(p,k){ const V=Object.prototype.hasOwnProperty.call(MP_VICE,k)?MP_VICE[k]:null; if(!V) return rej(p,'The waitress has never heard of that.'); const t=now();
    if(t-(p.lastVice||-1e12)<MPC.VICE_GAP) return rej(p,'🍸 The waitress is still walking over. Patience, champ.');
    if(V.win&&lbNet(p)<MPC.CIGAR_NET) return rej(p,`🏆 Victory cigars are for people up ${money(MPC.CIGAR_NET)}+. You're ${lifeSigned(lbNet(p))}. Have a vape.`);

  if(big&&big.big>0) h+=`<div>🎯 <b>Biggest hit:</b> ${esc(big.name)} +${money(big.big)}</div>`;

  if(loan&&loan.loan>0) h+=`<div>🥪 <b>Big Sal's best customer:</b> ${esc(loan.name)} borrowed ${money(loan.loan)} (not counted as winnings)</div>`;

  return h+`</div></div>`; }

// ===================== ARCADE ENGINES (pure logic + physics; no DOM, so they can be simulated/tested headless) =====================
// Everything here is deterministic given rnd() (seedRng for tests). The UI (62_arcade_ui.js) drives these engines.

// ---------- HOME RUN DERBY ----------
// Units: feet, seconds, mph. Side view: pitcher -> plate. Timing + bat height decide exit velo / launch / spray.
const HR_PITCH={fb:{n:'Heater',lo:90,hi:97,drop:-.12,w:.36},sl:{n:'Slider',lo:82,hi:88,drop:.85,w:.2},ch:{n:'Changeup',lo:77,hi:84,drop:.65,w:.2},cb:{n:'Hammer Curve',lo:70,hi:78,drop:1.8,w:.16},kn:{n:'Knuckler',lo:63,hi:70,drop:.45,w:.08,wob:1}};
const HR_SWING_T=.14, HR_WIN=.105, HR_YWIN=.5, HR_ZONE=[1.6,3.5], HR_OUTS=10, HR_WALL=9, HR_KD=.0014, HR_KL=.0002;
function hrPitch(n){ const ks=Object.keys(HR_PITCH); let x=rnd(), k='fb'; if(n>2) for(const q of ks){ if((x-=HR_PITCH[q].w)<0){ k=q; break; } }
  const P=HR_PITCH[k], mph=Math.round((P.lo+rnd()*(P.hi-P.lo))*10)/10;
  const yP=rnd()<.78?1.75+rnd()*1.6:(rnd()<.5?.9+rnd()*.7:3.5+rnd()*.6);
  return {k,n:P.n,mph,yP:Math.round(yP*100)/100,T:.8*Math.pow(95/mph,1.3),drop:P.drop*(.8+rnd()*.4),wob:P.wob?1+rnd()*5:0}; }
function hrInZone(p){ return p.yP>=HR_ZONE[0]&&p.yP<=HR_ZONE[1]; }
function hrBallY(p,u){ const y0=5.7, aim=p.yP+p.drop; return y0+(aim-y0)*u-p.drop*u*u+(p.wob?Math.sin(u*10+p.wob)*.35*u*(1-u)*4:0); }
function hrFence(sp){ const a=Math.min(1,Math.abs(sp)/45); return Math.round(330+(400-330)*Math.pow(Math.cos(a*Math.PI/2),1.4)); }
// dt = (contact time - plate arrival) in seconds (+ = late); batY = bat height at the plate (ft)
function hrContact(p,dt,batY){ const dy=p.yP-batY;
  if(Math.abs(dt)>HR_WIN||Math.abs(dy)>HR_YWIN) return {miss:true,dt,dy};
  const qt=1-(dt/HR_WIN)**2, qy=1-(dy/HR_YWIN)**2;
  const ev=Math.min(122,56+56*Math.pow(qt,.6)*(.42+.58*qy)+(p.mph-82)*.2+gauss()*1.5);
  const la=clamp(25+dy*62+gauss()*3.5,-25,80), spray=clamp(dt/HR_WIN*55+gauss()*4,-85,85);
  return Object.assign(hrFly(ev,la,spray),{dt,dy}); }
function hrFly(ev,la,spray){ const v=ev*1.4667, a=la*Math.PI/180; let vx=v*Math.cos(a), vy=v*Math.sin(a), x=0, y=3, t=0, peak=3, cleared=null, wall=false;
  const fence=hrFence(spray), foul=Math.abs(spray)>45, path=[[0,3,0]]; const h=.01; let k=0;

function pickEvent(){ const pool=EVENTS.filter(e=>!e.cond||e.cond()); const recent=S.flags.recentEv||[]; const p2=pool.filter(e=>!recent.includes(e.id)); const P=p2.length?p2:pool; const e=weighted(P.map(e=>[e,e.w])); S.flags.recentEv=[e.id,...recent].slice(0,8); return e; }

  setMain(h); }

function renderHelp(){ scene('title',[{id:'a',x:.5,pose:'point',hat:'cap',hatc:'#e8541e',label:'LISTEN UP'}],{});
  setMain(`<h2>📖 HOW TO PLAY</h2><div class="panel small">
  <p><b>Goal:</b> You start with $50 and owe Big Sal $10,000. Sal wants a weekly payment every Sunday (it grows as your bankroll grows) and EVERYTHING by day 28. Miss a payment = penalty + collectors at your door. 3 knockouts = river. Pay it all off to win, then optionally go for <b>Whale</b> ($50k).</p>
  <p><b>Each day</b> you get ⚡ energy (3, +1 at Hustle 6 and 9). Casino, Back Alley, Side Hustles, the Bar and Touch Grass cost ⚡1. The <b>Sportsbook</b>, Sal, the shop and your character sheet are free. Sleep to end the day.</p>
  <p><b>Sportsbook:</b> Two books (DraftQueens 👑 & FanDoodle 🌀) with slightly different lines, so <b>line shop!</b> Spreads/totals are −110 (the vig). Tap odds to build a slip; 2+ legs = parlay (or straights). Same-game legs = SGP (20% juice tax). Use promo tokens: bonus bets (stake not returned), no-sweat bets, profit boosts. Watch games in the <b>Live Sweat</b> to live-bet and cash out. Win too much and the books LIMIT you.</p>
  <p><b>Tilt:</b> Losing raises tilt. At 60+ you're forced to bet at least 10% of your roll; 85+ is 20% plus worse odds. At 100 you do something stupid. Beer, wins, sleep and touching grass lower it.</p>
  <p><b>Edges:</b> the house always has one, but you can beat it with perks: Sharp (see +EV bets), Rain Man (count cards), Vig Killer, Promo Abuser, Eagle Eye (monte), Bottom Dealer (cheat at poker). Fading El Jefe has historically... worked.</p>
  <p><b>Flip 7 (Tony's back room):</b> buy in against 2–3 degenerates. Each round hit or stay; draw a number you already have and you BUST (0). 7 different numbers ends the round (+15). Freeze banks someone out, Flip Three forces 3 cards, Second Chance saves one bust. First to 200 wins the pot (5% rake).</p>
  <p><b>🕹️ DegenClip Arcade:</b> skill games with real bets. <b>Home Run Derby</b>: move/tap to set your bat height, tap/click (or Space) to swing; early = pull, late = oppo; 10 outs (non-HR swings and taken strikes). <b>Mini Putt</b>: drag back from anywhere like a slingshot, release to putt; water is +1 stroke; max 6 a hole. <b>Bowling</b>: drag sideways at the bottom to move, swipe up to bowl: swipe direction aims, a curved swipe hooks, a fast swipe throws harder. Tickets pay by score, props pay fixed odds, hustles pay 2× (ties push). Payouts are priced from bot simulations of an average player with a ~7–9% house edge, so if you're actually good, you're the hustler.</p>
  <p><b>🃏 Euchre Hall:</b> 24 cards (9–A), two teams of two, and partners sit across from each other. Each player gets 5 cards and one card from the kitty is turned up. <b>Round 1:</b> going around from the dealer's left, each player either orders it up (that suit is trump and the dealer picks up the card and buries one) or passes. <b>Round 2:</b> if everyone passed, players can name any other suit or pass. With <i>stick the dealer</i> on, the dealer can't pass. With it off, four more passes throw the hand in. Whoever names trump can go <b>alone</b>, and their partner sits out the hand. Card ranking: <b>right bower</b> (J of trump) &gt; <b>left bower</b> (the other J of the same color, which counts as trump, including when you follow suit) &gt; A K Q 10 9 of trump &gt; everything else. You must follow the suit that was led if you can. Scoring: makers who take 3–4 tricks get 1, all 5 (a march) gets 2, a march while alone gets 4, and makers held to 2 or fewer tricks are <b>euchred</b>, which gives the defenders 2. First team to 10 (or 11) wins the pot. Farmer's hand (optional rule): a hand of all 9s and 10s can trade its 3 lowest cards for the kitty.</p>
  <p><b>🌐 Online casino leaderboard:</b> every online room keeps a live leaderboard ranked by session net (what you've actually won or lost on settled bets). Money still riding doesn't count against you yet, and 🥪 loans from Sal are listed separately because borrowing isn't winning. The leader gets a 👑 and last place is Sal's favorite customer. When the host closes the table, everyone gets final standings.</p><p><b>🍺 Tilt relief online:</b> tap <b>Cocktail Waitress / Smoke</b> in the top bar at any online table. Drinks and smokes lower your tilt, cost cash from your free bankroll and are allowed mid-hand. They follow the bar rules: booze adds Buzz and liquor costs HP. Nicotine has a cooldown and works less each time. Too much Buzz turns off strategy hints and can trigger a SLOPPY confirmation before you act.</p><p><b>Keno:</b> pick 1–10 numbers of 80, 20 get drawn, payout depends on how many you catch. RTP is ~75–87%. It's a lottery with a cocktail menu.</p>
  <p><b>Craps quick guide:</b> Pass Line on the come-out, add Odds once a point is set (true odds, no house edge). Place 6/8 pay 7:6. Hardways and Any 7 are fun sucker bets.</p>
  <p><b>Safety net:</b> new-user promos, Mom's emergency Venmo, plasma, and side jobs mean you can always claw back.</p></div>
  <button class="btn c" onclick="go(S&&!S.ended?'hub':'title')">⬅ Back</button>`); }

function monkey(opts){ opts=opts||{}; window.__mute=true; const M=window.__mk={clicks:0,daysPlayed:0,runs:0,endings:{},stuck:[],lastClickable:Date.now(),screens:{},maxDay:0,done:false,log:[]}; SND.on=false; U.silent=!!opts.silent;
  const maxDays=opts.days||60, tick=opts.tick||25; let lastDay=0;
  const iv=setInterval(()=>{ try{
    if(M.done){ clearInterval(iv); return; }
    if(U.live&&!U.live.done&&rnd()<.04) U.live.speed=4;
    const els=[...document.querySelectorAll('#main [onclick]')].filter(e=>!e.disabled&&e.offsetParent!==null&&!e.closest('[data-nomk]'));
    M.screens[U.screen]=(M.screens[U.screen]||0)+1;
    if(S&&S.day!==lastDay){ if(S.day>lastDay) M.daysPlayed+=lastDay?S.day-lastDay:0; lastDay=S.day; M.maxDay=Math.max(M.maxDay,S.day); }
    if(M.daysPlayed>=maxDays){ M.done=true; return; }
    if(!els.length){ const busy=U.busy||(U.live&&!U.live.done)||(U.al&&U.al.m&&U.al.m.phase!=='pick'&&U.al.m.phase!=='done')||(U.al&&U.al.h&&!U.al.h.over&&U.al.h.turn==='npc'); if(!busy&&Date.now()-M.lastClickable>6000){ M.stuck.push({screen:U.screen,text:document.getElementById('main').innerText.slice(0,300)}); M.lastClickable=Date.now(); go(S&&!S.ended?'hub':'title'); } return; }
    M.lastClickable=Date.now();
    if(U.screen==='ending'){ M.runs++; M.endings[S.ended]=(M.endings[S.ended]||0)+1; lastDay=0; }
    // weighting: prefer progress buttons sometimes to avoid infinite loops
    const txt=e=>(e.innerText||'').toLowerCase();
    let el; const prog=els.filter(e=>/sleep|leave|back|continue|get up|limp|stumble|casino floor|skip|new run|start the|open the door|wake/.test(txt(e)));
    const r=rnd();
    if(U.screen==='hub'&&S&&S.energy===0&&r<.5) el=els.find(e=>/sleep/.test(txt(e)));
    if(!el&&U.screen==='title') el=els.find(e=>/new run/.test(txt(e)));
    if(!el&&U.screen==='create') el=els.find(e=>/start the/.test(txt(e)))||els[0];
    if(!el&&prog.length&&r<(opts.prog||.12)) el=pick(prog);
    if(!el) el=pick(els);
    if(el&&/title screen|save & title/.test(txt(el))&&rnd()<.9) el=pick(els.filter(e=>!/title/.test(txt(e))))||el;
    if(el&&/move into the van|retire a winner/.test(txt(el))&&rnd()<.7) el=pick(els.filter(e=>!/van|retire/.test(txt(e))))||el;
    M.clicks++; el.click();
  }catch(e){ window.__errs.push('monkey: '+e.message+' '+e.stack); } }, tick); }
// Engine-level balance simulator (no UI): simple "reasonable player" policy
function balanceSim(n, policy){ U.silent=true; U.noSave=true; SND.on=false; const out=[];
  for(let run=0;run<n;run++){ S=newState('Bot',pick(['sharp','barfly','hustler','lucky'])); S.league=genLeague(); genSlate(); let fights=0, lost=0;
    while(!S.ended&&S.day<=fdy()+0&&S.day<70){
      // spend points
      while(S.statPts>0){ S.stats[pick(['hustle','cha','street','luck','liver'])]++; S.statPts--; } while(S.perkPts>0){ const pref=policy==='rand'?['grind','smooth','zen','stone']:['sharp','vigkiller','grind','promo','rainman','smooth','zen','stone'].filter(p=>!has(p)); if(!pref.length) break; S.perks.push(pref[0]); S.perkPts--; }
      // jobs
      S.flags.jobsToday={}; for(const id of ['tony','dash','tout']){ if(S.energy<=(policy==='degen'?1:0)) break; useEnergy(1); S.flags.jobsToday[id]=1; addCash(Math.round(JOBS[id].pay()*(has('grind')?1.5:1)*(1+Math.max(0,S.day-10)*.015))); addHp(JOBS[id].hp); gainXp(12); }
      // sportsbook
      const games=S.slate.games; const bank=S.cash;
      for(let ti=S.tokens.length-1;ti>=0;ti--){ const t=S.tokens[ti]; if(t.type==='bonus'){ const g=pick(games); const leg=makeLeg(g,'ml',g.fair.pH<.5?'h':'a',t.book); placeBet([leg],t.amt,{token:ti}); } }
      if(policy==='sharp'||policy==='degen'){ let cands=[]; for(const g of games) for(const b of ['DQ','FD']) for(const [m,s] of [['sp','h'],['sp','a'],['tot','o'],['tot','u'],['ml','h'],['ml','a']]){ const l=makeLeg(g,m,s,b); const ev=l.fp*amToDec(l.odds)-1; if(ev>(has('sharp')?0.01:-0.03)) cands.push([l,ev]); }
        cands.sort((a,b)=>b[1]-a[1]); const used=new Set(); for(const [l,ev] of cands.slice(0,4)){ if(used.has(l.gid)) continue; used.add(l.gid); const st=Math.max(minBet(),Math.min(S.books[l.book].max,Math.floor(bank*(policy==='degen'?.12:.05)))); if(st>=1&&st<=S.cash) placeBet([l],st); } }
      if(policy==='rand'){ for(let k=0;k<3;k++){ const g=pick(games); const [m,sd]=pick([['sp','h'],['sp','a'],['tot','o'],['tot','u'],['ml','h'],['ml','a']]); const l=makeLeg(g,m,sd,pick(['DQ','FD'])); const st=Math.max(minBet(),Math.floor(bank*.05)); if(st<=S.cash) placeBet([l],st); } }
      if(policy==='degen'&&games.length>=3&&S.cash>10){ const legs=shuffle(games.slice()).slice(0,3).map(g=>makeLeg(g,'ml',rnd()<.5?'h':'a','DQ')); placeBet(legs,Math.max(minBet(),Math.floor(S.cash*.05))); }
      simAllInstant();
      // blackjack session for the degen
      if(policy==='degen'&&S.energy>0&&S.cash>20){ useEnergy(1); for(let h=0;h<20&&S.cash>=5;h++){ const bet=Math.max(5,Math.min(casinoMax(),Math.floor(S.cash*.05))); addCash(-bet); const B=bjDeal(bet); let guard=0; while(B.phase==='play'&&guard++<20){ const hd=B.hands[B.active]; let a=basicStrategy(hd.cards,B.dealer[0]); if((a==='D'||a==='P')&&S.cash<hd.bet) a='H'; if(a==='P'&&!bjCanSplit(B)) a='H'; if(a==='D'&&!bjCanDouble(B)) a='H'; if(a==='D'||a==='P') addCash(-hd.bet); bjAct(B,{H:'hit',S:'stand',D:'double',P:'split'}[a]); } addCash(B.ret); } }
      // pay Sal: keep a bankroll cushion
      const d=S.day; if(S.cash>=S.debt&&!S.whaleMode){ payDebt(S.debt); }
      else if(d%7===0||d>=fdy()){ const need=dueLeft(); if(need>0) payDebt(Math.min(need,S.cash)); }
      else if(S.cash>1500){ payDebt(S.cash-1000); }
      if(S.debt<=0){ S.ended='debtfree'; break; }
      sleep();
      // resolve queue abstractly
      while(S.queue.length){ const q=S.queue.shift(); if(q.type==='fight'){ fights++; if(rnd()<.55+st('hustle')*.03){ addCash(ri(30,120)); } else { lost++; S.strikes++; payDebt(S.cash*.3); S.hp=Math.round(maxHp()*.35); if(S.strikes>=3){ S.ended='goons'; } } } else if(q.type==='final'){ S.ended=S.cash>=S.debt?'debtfree':(rnd()<.35?'van':'goons'); } else if(q.type==='hospital'){ S.debt+=500; S.hp=50; } }
      if(S.hp<=0){ S.hp=50; S.debt+=500; }
    }
    const H=S.hist.filter(b=>!b.token); const stk=H.reduce((s,b)=>s+b.stake,0), net=H.reduce((s,b)=>s+(b.net||0),0);
    out.push({end:S.ended||'timeout',day:S.day,cash:Math.round(S.cash),debt:Math.round(S.debt),peak:Math.round(S.peak),lvl:S.lvl,fights,lost,roi:stk?+(net/stk*100).toFixed(1):0,bets:H.length,limited:S.books.DQ.limited+S.books.FD.limited});
  }
  U.silent=false; U.noSave=false; return out; }
