<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#283048">
<title>Monster Rogue: Elemental Gauntlet</title>
<style>
:root{--ink:#383840;--bd:#283048}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#181c30;min-height:100%}
body{font-family:"Lucida Console","Courier New",Courier,monospace;font-weight:700;color:var(--ink);font-size:14px;line-height:1.35;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background-color:#f0f0dc;background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);background-size:8px 8px;display:flex;flex-direction:column;position:relative;overflow-x:hidden;text-shadow:1px 1px 0 rgba(0,0,0,.08)}
img{image-rendering:pixelated;image-rendering:crisp-edges}
img.pt{display:inline-block;vertical-align:middle}
.scr{padding:10px;display:flex;flex-direction:column;gap:10px;flex:1}
.box{background:#f8f8f8;border:3px solid var(--bd);border-radius:7px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #b8c8d8;padding:10px 12px}
.box.dk{background:#304060;color:#f8f8f8;box-shadow:inset 0 0 0 2px #506890}
.bar{background:linear-gradient(#5078d0,#3058a8);color:#fff;border:3px solid var(--bd);border-radius:7px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-shadow:1px 1px 0 #182850;flex-wrap:wrap}
.btn{display:block;width:100%;font:inherit;font-size:15px;padding:11px 12px 11px 24px;background:#f8f8f8;border:3px solid var(--bd);border-radius:7px;box-shadow:inset -3px -3px 0 #c8d0d8;cursor:pointer;color:var(--ink);text-align:left;position:relative;touch-action:manipulation}
.btn:hover:not([disabled]),.btn:focus-visible{background:#fff8d0;outline:none}
.btn:hover:not([disabled])::before,.btn:focus-visible::before{content:'\25B6';position:absolute;left:7px;font-size:11px;top:50%;transform:translateY(-50%)}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:inset 3px 3px 0 #c8d0d8}
.btn[disabled]{opacity:.45;cursor:default}
.btn.pri{background:#f8d860;box-shadow:inset -3px -3px 0 #c8a030}
.btn.red{background:#f8b0a0;box-shadow:inset -3px -3px 0 #c87060}
.btn.grn{background:#b8f0a0;box-shadow:inset -3px -3px 0 #78b860}
.btn.sm{font-size:12px;padding:7px 8px 7px 18px;width:auto;display:inline-block}
.btn.center{text-align:center;padding-left:12px}
.btn small,.sub{display:block;font-size:11px;color:#687078}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tb{display:inline-block;padding:1px 5px;border-radius:3px;color:#fff;font-size:10px;letter-spacing:.5px;text-shadow:1px 1px 0 rgba(0,0,0,.45);border:1px solid rgba(0,0,0,.35);vertical-align:middle;line-height:1.4}
.muted{color:#788088;font-size:12px}
.small{font-size:12px}
h2{margin:0;font-size:16px}
h3{margin:4px 0;font-size:14px}
.hpw{display:flex;align-items:center;gap:3px;background:#485850;border-radius:4px;padding:2px 3px 2px 4px;flex:1}
.hpw b{color:#f8b830;font-size:9px;line-height:1}
.hpb{flex:1;height:7px;background:#283028;border-radius:2px;overflow:hidden;border:1px solid #283028}
.hpf{height:100%;transition:width .45s linear,background-color .45s}
.xpw{height:4px;background:#405040;border-radius:2px;margin-top:3px;overflow:hidden}
.xpf{height:100%;background:#48a8f8;transition:width .5s}
.card{display:flex;gap:8px;align-items:center;background:#f8f8f8;border:3px solid var(--bd);border-radius:7px;padding:6px 8px;box-shadow:inset -3px -3px 0 #c8d0d8;cursor:pointer;position:relative}
.card.sel{background:#fff0a8;box-shadow:inset -3px -3px 0 #d8b848}
.card.dead{background:#e0d0d0}
.card .info{flex:1;min-width:0}
.card .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:11px;padding:2px 6px;border-radius:10px;background:#e0e8f0;border:2px solid #98a8b8;margin:2px}
.chip.on{background:#fff0a0;border-color:#d0a020}
.sb{display:inline-block;font-size:9px;padding:0 3px;border-radius:3px;color:#fff;margin-right:3px;vertical-align:middle}
.sb-brn{background:#e85830}.sb-par{background:#c8a800}.sb-slp{background:#8890a0}.sb-psn{background:#a040a0}.sb-fnt{background:#c03028}
/* battle */
.bwrap{display:flex;flex-direction:column;flex:1}
.field{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-bottom:4px solid var(--bd)}
.bg-wild{background:linear-gradient(#78c0f0 0,#a8d8f8 20%,#c8ecf8 38%,#90cc68 38%,#a8dc78 60%,#88c058 100%)}
.bg-trainer{background:linear-gradient(#f8d898 0,#f8e8b8 38%,#c8d890 38%,#b0c878 100%)}
.bg-elite{background:linear-gradient(#583050 0,#905070 38%,#a87088 38%,#805868 100%)}
.bg-gym{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 16px,transparent 16px 32px),linear-gradient(#a8b0d8 0,#c8d0f0 38%,#d8c8a0 38%,#c0b088 100%)}
.bg-champ{background:radial-gradient(circle at 50% 10%,#f8e8a0 0,transparent 30%),linear-gradient(#302868 0,#5848a0 38%,#8070c0 38%,#6050a0 100%)}
.plat{position:absolute;border-radius:50%}
.plat.e{right:4%;top:41%;width:44%;height:12%;background:#b8e088;box-shadow:inset 0 -6px 0 #88b858,0 0 0 3px #689840}
.plat.p{left:0;bottom:1%;width:52%;height:15%;background:#b8e088;box-shadow:inset 0 -7px 0 #88b858,0 0 0 3px #689840}
.bg-gym .plat,.bg-trainer .plat{background:#e8d8b0;box-shadow:inset 0 -6px 0 #c0a878,0 0 0 3px #988058}
.bg-elite .plat,.bg-champ .plat{background:#c8b8e8;box-shadow:inset 0 -6px 0 #9888c0,0 0 0 3px #706098}
.sprE{position:absolute;right:8%;bottom:50%;line-height:0}
.sprP{position:absolute;left:5%;bottom:5%;line-height:0}
.sprE img,.sprP img{animation:bob 1.2s steps(2) infinite}
.hud{position:absolute;background:#f8f8d8;border:3px solid #404838;border-radius:12px 3px 12px 3px;padding:4px 8px 5px;box-shadow:3px 3px 0 rgba(0,0,0,.25);width:48%;max-width:230px}
.hud.e{left:3%;top:5%}
.hud.p{right:3%;bottom:5%}
.hud .hr{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:2px}
.hud .hr2{display:flex;align-items:center;gap:3px}
.hpt{text-align:right;font-size:12px;line-height:1.1;margin-top:1px}
.tbox{margin:6px 8px 0;background:#fff;border:4px solid #303848;border-radius:8px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 5px #d86848;padding:8px 12px;height:clamp(96px,16vh,150px);overflow-y:auto;font-size:14px;line-height:1.3}
.tbox p{margin:0 0 3px}
.tbox p.old{color:#a0a8b0;font-size:12px}
.bmenu{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bmenu .full{grid-column:span 2}
.mvb{border-left-width:10px}
.bfoot{padding:0 8px 10px;font-size:11px}
.pop{position:absolute;font-size:18px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:popup .9s forwards;pointer-events:none;z-index:5}
.pop.se{color:#f8e048}.pop.nv{color:#c0c8d0}.pop.hl{color:#78f878}
@keyframes popup{0%{transform:translateY(0) scale(.6);opacity:1}30%{transform:translateY(-14px) scale(1.15)}100%{transform:translateY(-34px);opacity:0}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes flash{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}}
.flash{animation:flash .45s steps(1) 1!important}
@keyframes lungeP{50%{transform:translate(22px,-12px)}}
@keyframes lungeE{50%{transform:translate(-22px,10px)}}
.lunge-p{animation:lungeP .28s ease-in-out 1!important}
.lunge-e{animation:lungeE .28s ease-in-out 1!important}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.shake{animation:shake .35s 1}
.faint{animation:faint .5s forwards!important}
@keyframes faint{to{transform:translateY(70%);opacity:0;clip-path:inset(0 0 100% 0)}}
.sendin{animation:sendin .35s ease-out 1!important}
@keyframes sendin{from{transform:scale(.1);opacity:0;filter:brightness(4)}}
.statup{animation:statup .5s steps(2) 1!important}
@keyframes statup{50%{filter:brightness(1.6) hue-rotate(-30deg)}}
.statdn{animation:statdn .5s steps(2) 1!important}
@keyframes statdn{50%{filter:brightness(.6) saturate(.4)}}
.absorb{animation:absorb .35s forwards!important}
@keyframes absorb{to{transform:scale(0);opacity:0;filter:brightness(5)}}
.orb{position:absolute;z-index:6;width:30px;height:30px;transition:all .4s cubic-bezier(.3,.0,.6,1)}
.wiggle{animation:wiggle .4s 1}
@keyframes wiggle{25%{transform:rotate(-25deg)}75%{transform:rotate(25deg)}}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 3px #f8d030}}
@keyframes blink{50%{opacity:.25}}
.blink{animation:blink 1s steps(1) infinite}
/* map */
.map{position:relative}
.map svg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);height:62px;align-items:center;justify-items:center;position:relative;z-index:1}
.mrow.one{grid-template-columns:1fr}
.mrow .fl{position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:9px;color:#8890a0}
.node{width:46px;height:46px;border-radius:10px;border:3px solid var(--bd);background:#e8e8e0;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15);position:relative;text-shadow:none}
.node.boss{width:58px;height:52px;font-size:26px}
.node.avail{animation:pulse .9s steps(2) infinite;background:#fff8c0;cursor:pointer}
.node.past{opacity:.35}
.node.vis{background:#98e098;opacity:1}
.node.far{opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px}
/* misc */
.center{text-align:center}
.big{font-size:18px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 4px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#304060;color:#fff;border:3px solid #101828;border-radius:8px;padding:8px 14px;z-index:99;max-width:90%;font-size:13px;animation:toast 2.6s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.tchart{border-collapse:collapse;font-size:10px;margin:0 auto}
.tchart td,.tchart th{width:23px;height:22px;text-align:center;border:1px solid #c8c8c0;padding:0}
.tchart th{color:#fff;text-shadow:1px 1px 0 #000;font-size:8px}
.c2{background:#78d858}.c5{background:#f09078}.c0{background:#404040;color:#fff}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stat{display:grid;grid-template-columns:38px 30px 1fr;gap:4px;align-items:center;font-size:11px}
.stat .sbar{height:6px;background:#d0d8e0;border-radius:3px;overflow:hidden}
.stat .sbar i{display:block;height:100%;background:#58a8f0}
input.nm{font:inherit;font-size:15px;padding:6px 8px;border:3px solid var(--bd);border-radius:6px;width:100%;text-transform:uppercase;background:#fff}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:4px}
.dex div{background:#fff;border:2px solid #c8d0d8;border-radius:6px;text-align:center;padding:2px;font-size:8px;cursor:pointer;overflow:hidden}
.dex div.a{border-color:#e05030;background:#ffe8e0}.dex div.b{border-color:#3060d0;background:#e0e8ff}
.dex div.lock{filter:brightness(0) opacity(.25);cursor:default}
.evo img{transition:filter .1s}
.white{filter:brightness(0) invert(1)}
p{margin:4px 0}
ul{margin:4px 0;padding-left:18px}
li{margin:2px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= DATA: types, chart, moves ================= */
const TYPES=['Normal','Fire','Water','Grass','Electric','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
const TC={Normal:'#a8a878',Fire:'#f08030',Water:'#6890f0',Grass:'#78c850',Electric:'#e8c020',Ice:'#78c8c8',Fighting:'#c03028',Poison:'#a040a0',Ground:'#d0a850',Flying:'#a890f0',Psychic:'#f85888',Bug:'#a8b820',Rock:'#b8a038',Ghost:'#705898',Dragon:'#7038f8',Dark:'#705848',Steel:'#a0a0c0',Fairy:'#e888a8'};
const TICON={Normal:'⭐',Fire:'🔥',Water:'💧',Grass:'🌿',Electric:'⚡',Ice:'❄️',Fighting:'👊',Poison:'☠️',Ground:'⛰️',Flying:'🪽',Psychic:'🔮',Bug:'🐛',Rock:'🪨',Ghost:'👻',Dragon:'🐉',Dark:'🌑',Steel:'⚙️',Fairy:'✨'};
const CHART={
Normal:{Rock:.5,Ghost:0,Steel:.5},
Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},
Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2,Fairy:.5},
Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0,Fairy:2},
Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},
Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5,Fairy:.5},
Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},
Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5},
Dragon:{Dragon:2,Steel:.5,Fairy:0},
Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Fairy:.5},
Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5,Fairy:2},
Fairy:{Fire:.5,Fighting:2,Poison:.5,Dragon:2,Dark:2,Steel:.5}};
function eff(t,defTypes){let m=1;for(const d of defTypes){const r=CHART[t][d];if(r!==undefined)m*=r;}return m;}

const MV={};
// [name,type,power,acc,effects]  st=status on target (ch=chance), self/tgt=stat stages (sch=chance), heal, drain, prio, recoil, crit
[
['Tackle','Normal',40,100],['Quick Dash','Normal',40,100,{prio:1}],['Headbutt','Normal',70,100],
['Body Press','Normal',85,100,{st:'par',ch:.3}],['Reckless Ram','Normal',120,100,{recoil:.33}],
['Focus Up','Normal',0,100,{self:{atk:2}}],['Harden','Normal',0,100,{self:{def:2}}],['Soothe','Normal',0,100,{heal:.5}],
['Lullaby','Normal',0,60,{st:'slp'}],['Growl','Normal',0,100,{tgt:{atk:-1}}],
['Ember','Fire',40,100,{st:'brn',ch:.1}],['Flame Wheel','Fire',60,100,{st:'brn',ch:.1}],['Flamethrower','Fire',90,100,{st:'brn',ch:.1}],
['Inferno Blast','Fire',120,85,{st:'brn',ch:.3}],['Scorch Veil','Fire',0,85,{st:'brn'}],
['Bubble','Water',40,100,{tgt:{spd:-1},sch:.2}],['Aqua Jet','Water',40,100,{prio:1}],['Tide Slam','Water',80,100],
['Hydro Cannon','Water',120,80],['Aqua Ring','Water',0,100,{heal:.5}],
['Vine Lash','Grass',45,100],['Mega Sip','Grass',40,100,{drain:.5}],['Leaf Blade','Grass',85,100,{crit:1}],
['Giga Sip','Grass',75,100,{drain:.5}],['Solar Burst','Grass',120,85],['Spore Dust','Grass',0,75,{st:'slp'}],['Growth','Grass',0,100,{self:{atk:1,def:1}}],
['Spark','Electric',40,100,{st:'par',ch:.1}],['Volt Fang','Electric',65,95,{st:'par',ch:.15}],['Thunderbolt','Electric',90,100,{st:'par',ch:.1}],
['Thunder Crash','Electric',120,75,{st:'par',ch:.3}],['Static Wave','Electric',0,90,{st:'par'}],
['Ice Shard','Ice',40,100,{prio:1}],['Chill Wind','Ice',55,95,{tgt:{spd:-1}}],['Frost Fang','Ice',65,95,{tgt:{spd:-1},sch:.2}],
['Glacier Beam','Ice',90,100,{tgt:{spd:-1},sch:.2}],['Blizzard Gale','Ice',110,70,{tgt:{spd:-1},sch:.3}],
['Karate Chop','Fighting',50,100,{crit:1}],['Low Sweep','Fighting',65,100,{tgt:{spd:-1}}],['Power Punch','Fighting',85,100],
['Close Combat','Fighting',120,100,{self:{def:-1}}],['Bulk Up','Fighting',0,100,{self:{atk:1,def:1}}],
['Poison Sting','Poison',30,100,{st:'psn',ch:.3}],['Acid Spray','Poison',40,100,{tgt:{def:-2}}],['Sludge Bomb','Poison',90,100,{st:'psn',ch:.3}],
['Gunk Wave','Poison',120,80,{st:'psn',ch:.3}],['Toxic Mist','Poison',0,90,{st:'psn'}],
['Mud Shot','Ground',55,95,{tgt:{spd:-1}}],['Dig Strike','Ground',80,100],['Earthquake','Ground',100,100],
['Peck','Flying',35,100],['Wing Slash','Flying',60,100],['Air Blade','Flying',75,95,{crit:1}],['Sky Dive','Flying',110,90],
['Tailwind','Flying',0,100,{self:{spd:2}}],['Roost','Flying',0,100,{heal:.5}],
['Psi Bolt','Psychic',50,100],['Psybeam','Psychic',65,100],['Psychic Wave','Psychic',90,100,{tgt:{def:-1},sch:.1}],
['Mind Blast','Psychic',120,85],['Calm Focus','Psychic',0,100,{self:{atk:1,spd:1}}],['Hypnosis','Psychic',0,60,{st:'slp'}],
['Bug Bite','Bug',60,100],['X-Slash','Bug',80,100],['Silk Shot','Bug',0,95,{tgt:{spd:-2}}],['Swarm Rush','Bug',90,100],
['Moth Dance','Bug',0,100,{self:{atk:1,spd:1}}],['Leech Life','Bug',70,100,{drain:.5}],
['Rock Throw','Rock',50,90],['Rock Slide','Rock',75,90],['Stone Edge','Rock',100,80,{crit:1}],['Rock Polish','Rock',0,100,{self:{spd:2}}],
['Head Smash','Rock',130,80,{recoil:.33}],
['Lick','Ghost',30,100,{st:'par',ch:.3}],['Shadow Claw','Ghost',70,100,{crit:1}],['Shadow Orb','Ghost',80,100,{tgt:{def:-1},sch:.2}],
['Phantom Rend','Ghost',100,95],['Dream Haunt','Ghost',0,70,{st:'slp'}],
['Dragon Breath','Dragon',60,100,{st:'par',ch:.3}],['Dragon Claw','Dragon',80,100],['Draco Fury','Dragon',120,100,{recoil:.25}],
['Dragon Rite','Dragon',0,100,{self:{atk:1,spd:1}}],
['Bite','Dark',60,100],['Night Slash','Dark',70,100,{crit:1}],['Crunch','Dark',80,100,{tgt:{def:-1},sch:.2}],['Dark Pulse','Dark',90,100],
['Nasty Grin','Dark',0,100,{self:{atk:2}}],
['Metal Claw','Steel',50,95,{self:{atk:1},sch:.1}],['Iron Head','Steel',80,100],['Flash Cannon','Steel',90,100,{tgt:{def:-1},sch:.1}],
['Meteor Mash','Steel',100,90,{self:{atk:1},sch:.2}],['Iron Defense','Steel',0,100,{self:{def:2}}],
['Fairy Wind','Fairy',40,100],['Draining Kiss','Fairy',50,100,{drain:.75}],['Dazzle Gleam','Fairy',80,100],
['Moon Blast','Fairy',95,100,{tgt:{atk:-1},sch:.3}],['Charm','Fairy',0,100,{tgt:{atk:-2}}],['Wish Light','Fairy',0,100,{heal:.5}]
].forEach(([name,type,pow,acc,fx])=>{MV[name]=Object.assign({name,type,pow,acc},fx||{});});

function moveDesc(m){
  const p=[];
  if(m.prio)p.push('Strikes first');
  if(m.st){const n={brn:'burn',par:'paralyze',slp:'sleep',psn:'poison'}[m.st];p.push(m.pow>0?`${Math.round((m.ch||1)*100)}% ${n}`:`Inflicts ${n}`);}
  const sn={atk:'Atk',def:'Def',spd:'Spd'};
  if(m.self)p.push((m.sch&&m.sch<1?Math.round(m.sch*100)+'% ':'')+'User '+Object.entries(m.self).map(([k,v])=>sn[k]+(v>0?'+':'')+v).join(' '));

  if(m.heal)p.push('Heals 50%');
  if(m.drain)p.push(`Drains ${Math.round(m.drain*100)}%`);
  if(m.recoil)p.push('Recoil');
  if(m.crit)p.push('High crit');

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
const SHADE_C=new Map();
function shade(h,a){const k=h+a;if(SHADE_C.has(k))return SHADE_C.get(k);const[r,g,b]=hex2rgb(h);let o;
  if(a>=0)o=rgb2hex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);else{const m=1+a;o=rgb2hex(r*m,g*m,b*m+(1-m)*40);}SHADE_C.set(k,o);return o;}

function rewardCreature(f){return makeCreature(pick(wildPool(f+3)),clamp(flv(f)-1,3,100));}
function genRewards(kind,defeated){
  const f=G.floor,opts=[];
  const w=kind==='wild'?{creature:2,tutor:3,potions:3,candy:2,orbs:2.5,relic:.7,money:1}:{creature:3,tutor:3,potions:2,candy:2.2,orbs:1.5,relic:1.4,money:1};
  if(kind==='elite'){const r=randomRelics(1)[0];if(r)opts.push({k:'relic',id:r});}
  let guard=0;while(opts.length<3&&guard++<50){const k=wpick(w);if(opts.some(o=>o.k===k))continue;
    if(k==='creature'){let c;if(defeated&&defeated.length&&rnd()<.5){const d=pick(defeated);c=d.sp?makeCreature(SP[d.sp].line,clamp(flv(f)-1,3,100)):rewardCreature(f);}else c=rewardCreature(f);opts.push({k,c});}
    else if(k==='relic'){const r=randomRelics(1)[0];if(r)opts.push({k,id:r});}
    else if(k==='potions')opts.push({k,items:f>8?{super:1,potion:1}:{potion:2}});
    else if(k==='orbs')opts.push({k,items:f>6?{great:1,orb:1}:{orb:2}});
    else if(k==='candy')opts.push({k,items:{candy:f>10?2:1}});
    else if(k==='money')opts.push({k,amt:60+f*12});
    else opts.push({k});}
  return opts;}
function moneyFor(kind){const f=G.floor;let m={wild:20+f*3,trainer:45+f*8,elite:90+f*12,gym:250+f*10,champ:0}[kind]||20;if(G.relics.includes('coin'))m=Math.round(m*1.5);return m;}
function price(p){return G.relics.includes('coupon')?Math.round(p*.75):p;}
function tutorMoves(c){const f=G.floor,cap=60+f*4;const known=new Set(c.moves);const ty=types(c);
  const all=Object.values(MV).filter(m=>!known.has(m.name));
  const stab=shuffle(all.filter(m=>ty.includes(m.type)&&m.pow>0&&m.pow<=cap));
  const cov=shuffle(all.filter(m=>!ty.includes(m.type)&&m.pow>=50&&m.pow<=cap));
  const util=shuffle(all.filter(m=>m.pow===0));
  const out=[];[stab[0],cov[0],util[0],cov[1],stab[1]].forEach(m=>{if(m&&out.length<3&&!out.includes(m.name))out.push(m.name);});return out;}

function enterNode(n){const f=G.floor;

  else if(n.t==='trainer'){const t=trainerTeam(f,false);startBattle('trainer',t.team,{name:t.name});}
  else if(n.t==='elite'){const t=trainerTeam(f,true);startBattle('elite',t.team,{name:t.name,potions:1});}
  else if(n.t==='gym'){const L=leaderOf(n.g);startBattle('gym',gymTeam(n.g),{name:L.n,potions:n.g+1});}
  else if(n.t==='champ'){startBattle('champ',champTeam(),{name:CHAMP.n,potions:3,relics:['sash']});}
  else if(n.t==='heal')scrHeal();else if(n.t==='shop')scrShop();else if(n.t==='event')scrEvent();
  else if(n.t==='recruit')scrRecruit();else if(n.t==='fusion')scrLab('run');}

function pipeline(then){Q=[stepPending];if(then)Q.push(then);runQ();}
function stepPending(){
  if(G.pendingEvo.length){const id=G.pendingEvo.shift();const c=G.team.find(x=>x.uid===id);Q.unshift(stepPending);
    if(c&&!c.custom&&spec(c).evo&&c.lvl>=spec(c).evo[0])scrEvolve(c);else runQ();return;}
  if(G.pendingMoves.length){const pm=G.pendingMoves.shift();const c=G.team.find(x=>x.uid===pm.uid);Q.unshift(stepPending);
    if(c&&!c.moves.includes(pm.move)){if(c.moves.length<4){c.moves.push(pm.move);toast(`${cname(c)} learned ${pm.move}!`);runQ();}else scrLearn(c,pm.move,runQ);}else runQ();return;}
  runQ();}

function finishBattle(){if(!B)return;const r=B.over,kind=B.kind,defeated=B.defeated.slice(),caught=B.caught;
  G.team.forEach(c=>{c.status=null;c.slp=0;});
  if(r==='lose'){B=null;return endRun(false);}

  if(r==='run')return pipeline(advance);
  G.stats.won++;G.money+=U.money||0;
  {const hp=.25+(G.relics.includes('medkit')?.2:0);G.team.forEach(c=>{if(c.hp>0)c.hp=Math.min(maxHp(c),c.hp+Math.ceil(maxHp(c)*hp));});}

 <h3>Tips</h3><ul><li>Tap the battle screen to speed through animations (or set FAST in Settings).</li><li>Your run auto-saves on the map screen.</li><li>Cover multiple types so gyms can't wall you.</li></ul></div></div>`);}
function scrChart(sel){const ab=t=>t.slice(0,3).toUpperCase();
  let h='<table class="tchart"><tr><th style="background:#405060">ATK\\DEF</th>'+TYPES.map(t=>`<th style="background:${TC[t]}">${ab(t)}</th>`).join('')+'</tr>';
  TYPES.forEach(a=>{h+=`<tr><th style="background:${TC[a]}" onclick="scrChart('${a}')">${ab(a)}</th>`+TYPES.map(d=>{const e=eff(a,[d]);return`<td class="${e>1?'c2':e===0?'c0':e<1?'c5':''}">${e>1?'2':e===0?'0':e<1?'½':''}</td>`;}).join('')+'</tr>';});h+='</table>';
  let info='<p class="muted">Tap a type below for its matchups.</p>';
  if(sel){const strong=TYPES.filter(d=>eff(sel,[d])>1),weak=TYPES.filter(d=>eff(sel,[d])<1&&eff(sel,[d])>0),none=TYPES.filter(d=>eff(sel,[d])===0);
    const wk=TYPES.filter(a=>eff(a,[sel])>1),rs=TYPES.filter(a=>eff(a,[sel])<1&&eff(a,[sel])>0),im=TYPES.filter(a=>eff(a,[sel])===0);
    info=`<h3>${TICON[sel]} ${sel}</h3><p class="small">Attacking - 2x vs: ${tbs(strong)||'-'}<br>0.5x vs: ${tbs(weak)||'-'}<br>0x vs: ${tbs(none)||'-'}</p><p class="small">Defending - weak to: ${tbs(wk)||'-'}<br>resists: ${tbs(rs)||'-'}<br>immune to: ${tbs(im)||'-'}</p><p class="small">Synergy (3+): ${SYN[sel]}</p>`;}
  render(`<div class="scr"><div class="bar"><span>${pt('TYPE CHART',2,'#fff','#182850')}</span><button class="btn sm" onclick="${G?'scrMap()':'scrTitle()'}">BACK</button></div>
   <div class="box"><div>${TYPES.map(t=>`<span class="chip ${t===sel?'on':''}" onclick="scrChart('${t}')">${TICON[t]} ${t}</span>`).join('')}</div>${info}</div>
   <div class="box scrollx">${h}<p class="muted">Rows = attacking type, columns = defending type. Green 2x, red ½x, black 0x. Dual types multiply.</p></div></div>`);}
/* ================= AUTOPLAY (testing only: open with #auto) ================= */
let AUTO_T=null;
window.__auto={runs:0,results:[],errors:[],target:+((HASH.match(/runs=(\d+)/)||[])[1]||1),steps:0};
function autoHook(){clearTimeout(AUTO_T);AUTO_T=setTimeout(autoStep,1);}
function autoStep(){const A=window.__auto;A.steps++;if(A.done)return;
 try{
  if(!G){if(U.offer){const ci=META.customs.length&&rnd()<.3?META.customs.length-1:-1;return ci>=0?pickCustom(ci):pickStarter(ri(0,U.offer.length-1));}
    if(A.runs>=A.target){A.done=true;return;}return scrStarter();}
  const s=G.screen;
  if(s==='summary'){A.results.push({win:G.result.win,floor:G.result.floor,badges:G.badges,lv:G.team.map(c=>c.lvl),team:G.team.map(cname),fused:G.stats.fused,caught:G.stats.caught});A.runs++;G=null;U={};return autoHook();}
  if(s==='map'){const fd=G.team.findIndex(c=>c.hp<=0);if(fd>=0&&G.items.revive>0){G.items.revive--;G.team[fd].hp=Math.floor(maxHp(G.team[fd])/2);return scrMap();}
    const lo=G.team.findIndex(c=>c.hp>0&&c.hp<maxHp(c)*.5);if(lo>=0&&(G.items.potion>0||G.items.super>0)){const k=G.items.potion>0?'potion':'super';G.items[k]--;const c=G.team[lo];c.hp=Math.min(maxHp(c),c.hp+Math.ceil(maxHp(c)*ITEMS[k].amt));return scrMap();}
    if(G.items.candy>0){G.items.candy--;levelUp(G.team[0],null);if(G.pendingEvo.length||G.pendingMoves.length)return pipeline(scrMap);return scrMap();}const av=availLanes();const row=G.map[G.floor];const hpF=G.team.reduce((t,c)=>t+c.hp/maxHp(c),0)/G.team.length;
    let j=pick(av);const hi=av.find(k=>row[k]&&row[k].t==='heal');if(hpF<.6&&hi!==undefined)j=hi;
    const fi=av.find(k=>row[k]&&row[k].t==='fusion');if(fi!==undefined&&G.team.length>=4&&rnd()<.7)j=fi;return selectNode(j);}
  if(s==='battle'){if(U.busy||!B)return;
    if(B.over){if($('#bmenu button'))return finishBattle();return;}
    if(U.bmode==='force'){const i=G.team.findIndex((c,k)=>c.hp>0&&k!==B.p.a);return forceSw(i);}
    const a=act(B.p),e=act(B.e);
    if(B.kind==='wild'&&G.team.length<6&&e.hp<maxHp(e)*.5&&a.hp>maxHp(a)*.4&&(G.items.orb>0||G.items.great>0))return bAct({type:'catch',item:G.items.great>0?'great':'orb'});
    if(a.hp<maxHp(a)*.3&&(G.items.super>0||G.items.potion>0)&&rnd()<.6)return bAct({type:'item',item:G.items.super>0?'super':'potion',target:B.p.a});
    const sc=a.moves.map(m=>({m,s:scoreMove(B.p,a,B.e,e,m)})).sort((x,y)=>y.s-x.s);
    const bestEff=Math.max(0,...a.moves.filter(m=>MV[m].pow>0).map(m=>eff(MV[m].type,types(e))));
    if(bestEff<1&&rnd()<.5){const i=G.team.findIndex((c,k)=>c.hp>c.lvl&&k!==B.p.a&&c.moves.some(m=>MV[m].pow>0&&eff(MV[m].type,types(e))>1));if(i>=0)return bAct({type:'switch',to:i});}
    if(sc[0].s<1){const i=G.team.findIndex((c,k)=>c.hp>0&&k!==B.p.a);if(i>=0&&rnd()<.5)return bAct({type:'switch',to:i});}
    return bAct({type:'move',move:rnd()<.1?pick(a.moves):sc[0].m});}
  if(s==='reward'){let i=U.rew.findIndex(o=>o.k==='creature');if(i<0||G.team.length>=5)i=U.rew.findIndex(o=>o.k==='relic');if(i<0)i=0;return takeReward(i);}
  if(s==='badge')return U.rel.length?takeRelic(0):runQ();
  if(s==='teamfull')return fullSwap(rnd()<.5?-1:G.team.reduce((b,c,i)=>c.lvl<G.team[b].lvl?i:b,0));
  if(s==='heal')return pipeline(advance);
  if(s==='shop'){const i=U.shop.findIndex(x=>x.k==='item'&&x.id==='super');if(G.money>200&&U.shop[i]&&G.money>=U.shop[i].p)return buy(i);
    const r=U.shop.findIndex(x=>x.k==='relic'&&!x.sold&&G.money>=x.p);if(r>=0&&rnd()<.5)return buy(r);return pipeline(advance);}
  if(s==='event'){if($('button[onclick="evDone()"]'))return evDone();return evChoose(ri(0,U.ev.o.length-1));}
  if(s==='recruit')return recPick(0);
  if(s==='evolve'){const b=$('#evoBtn button');if(b)return runQ();return;}
  if(s==='learn')return learnPick(rnd()<.6?ri(0,3):-1);
  if(s==='tutor'){if(U.tut.c&&U.tut.opts&&$('button[onclick^="tutorTeach"]'))return tutorTeach(0);return tutorPick(ri(0,G.team.length-1));}
  if(s==='fusedone')return U.lab.mode==='core'?scrTeam():pipeline(advance);
  if(s==='lab'){if(!U.lab||U.lab.mode==='core')return scrMap();if(G.team.length<2)return pipeline(advance);
    if(G.team.length>=3&&U.lab.a===null){U.lab.a=G.team.length-2;U.lab.b=G.team.length-1;return labRender();}
    if(U.lab.a!==null){const b=$('button[onclick="labConfirm()"]');if(b&&!b.disabled)return labConfirm();}
    return pipeline(advance);}
  if(s==='team'||s==='bag'||s==='relics')return scrMap();
 }catch(err){A.errors.push(String(err&&err.stack||err));console.error('AUTO',err);}
}
window.addEventListener('error',e=>{window.__auto&&window.__auto.errors.push(String(e.message));});
/* ================= BOOT ================= */
scrTitle();
</script>
